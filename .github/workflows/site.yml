name: Website
on:
  workflow_run:
    workflows: ["Weekly search"]   # rebuild after every search or screening run
    types: [completed]
  push:
    branches: [main]
    paths: ["pipeline/site.py", "site_src/**", "prompts/eligibility.md", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }        # the data commit the search run just pushed
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pipeline.site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
