name: Weekly search
on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays, about 6:17 am Central
  push:
    paths: ["run-request.txt"]   # committing a mode to this file starts a run
  workflow_dispatch:
    inputs:
      mode:
        description: "counts, baseline, or weekly"
        default: weekly
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run search
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "push" ]; then MODE="$(head -n1 run-request.txt | tr -d '[:space:]')"; fi
          case "$MODE" in counts|baseline|weekly) ;; *) MODE=weekly ;; esac
          echo "mode: $MODE"
          python -m pipeline.search "$MODE" 2> data/last_run.err | tee data/last_run.json
      - name: Commit records
        if: always()
        run: |
          git config user.name "living-meta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Search run $(date -u +%F)"
          git pull --rebase -q && git push
