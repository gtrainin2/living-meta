name: Weekly search
on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays, about 6:17 am Central: weekly search
    - cron: "37 * * * *"       # hourly: collect finished screening batches
  push:
    paths: ["run-request.txt"]   # committing a mode to this file starts a run
  workflow_dispatch:
    inputs:
      mode:
        description: "counts, baseline, weekly, dedup, rules, calibrate, submit, or poll"
        default: weekly
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run search
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "push" ]; then MODE="$(head -n1 run-request.txt | tr -d '[:space:]')"; fi
          if [ "${{ github.event.schedule }}" = "37 * * * *" ]; then MODE=poll; fi
          case "$MODE" in counts|baseline|weekly|dedup|rules|calibrate|submit|poll) ;; *) MODE=weekly ;; esac
          echo "mode: $MODE"
          if [ "$MODE" = calibrate ]; then
            python -m pipeline.screen calibrate 2> data/last_run.err | tee data/last_run.json
          elif [ "$MODE" = submit ] || [ "$MODE" = poll ]; then
            python -m pipeline.batch "$MODE" 2> data/last_run.err | tee data/last_run.json
          else
            python -m pipeline.search "$MODE" 2> data/last_run.err | tee data/last_run.json
          fi
      - name: Apply audit decisions
        if: always()
        run: python -m pipeline.audit apply > data/last_audit.json
      - name: Commit records
        if: always()
        run: |
          git config user.name "living-meta-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch data/records.sqlite
          git add data
          git diff --cached --quiet || git commit -m "Search run $(date -u +%F)"
          git pull --rebase -q && git push
